spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/minimercado}
spring.datasource.username=${DB_USER:minimercado}
spring.datasource.password=${DB_PASS:minimercado}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway is the only schema owner; Hibernate only validates the result.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
