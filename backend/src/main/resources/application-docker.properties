spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/minimercado}
spring.datasource.username=${DB_USER:minimercado}
spring.datasource.password=${DB_PASS:minimercado}
spring.datasource.driver-class-name=org.postgresql.Driver

# Local container deployment keeps data and evolves the schema of its persistent volume.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
